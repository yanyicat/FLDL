<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>富禮大廈：監視者模擬器</title>
    <style>
        :root { --bg: #0d0d0d; --accent: #d35400; --neon: #00ff41; }
        
        /* 基礎設置，確保內容不超出螢幕 */
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            background: var(--bg); 
            color: #ccc; 
            font-family: monospace; 
            overflow: hidden; /* 防止整頁捲動，改由內部區塊捲動 */
        }
        
        body { display: flex; flex-direction: column; }

        /* 頂部狀態列 */
        .header { 
            background: #1a1a1a; 
            padding: 10px 15px; 
            border-bottom: 2px solid var(--accent); 
            display: flex; 
            justify-content: space-between; 
            font-size: 14px; 
            flex-shrink: 0; /* 禁止被擠壓 */
        }
        
        /* 大廈顯示區：固定高度，保證監視器有位子 */
        #building-area { 
            height: 50vh; /* 佔據螢幕一半高度 */
            background: #000; 
            overflow-y: auto; 
            padding: 10px; 
            display: flex; 
            justify-content: center;
            flex-shrink: 0;
        }
        
        #building { 
            display: flex; 
            flex-direction: column-reverse; 
            gap: 4px; 
            width: 100%; 
            max-width: 320px; 
        }
        
        .floor { display: flex; gap: 4px; height: 35px; }
        .label { width: 30px; color: #555; font-size: 10px; display: flex; align-items: center; justify-content: center; }
        .room { flex: 1; background: #1a1a1a; border: 1px solid #333; position: relative; border-radius: 2px; cursor: pointer; }
        .room:active { background: var(--accent); }
        .room.seen { border-color: #555; background: #111; }
        .scent { position: absolute; inset: 0; background: radial-gradient(circle, rgba(155,89,182,0.4) 0%, transparent 80%); }

        /* 監視器區：佔用剩下的所有空間 */
        #console { 
            flex: 1; 
            background: #050505; 
            border-top: 2px solid #222; 
            display: flex; 
            flex-direction: column; 
            padding: 10px; 
            min-height: 0; /* 重要：防止 flex 項目溢出 */
        }
        
        #log { 
            flex: 1; 
            overflow-y: auto; 
            color: var(--neon); 
            font-size: 13px; 
            line-height: 1.5; 
            border: 1px solid #1a1a1a; 
            padding: 10px; 
            background: rgba(0,0,0,0.8);
            -webkit-overflow-scrolling: touch; /* 優化手機滾動 */
        }
        
        .btn { 
            background: var(--accent); 
            color: white; 
            border: none; 
            padding: 12px; 
            margin-top: 8px; 
            border-radius: 4px; 
            font-weight: bold; 
            cursor: pointer; 
            flex-shrink: 0; 
        }
        
        .entry { margin-bottom: 10px; border-bottom: 1px solid #111; padding-bottom: 6px; }

        /* 結局幕 */
        #end-screen { 
            display: none; 
            position: fixed; /* 改用 fixed 確保覆蓋全螢幕 */
            inset: 0; 
            background: #000; 
            color: #fff; 
            z-index: 9999; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            padding: 30px; 
            text-align: center; 
        }
        .end-text { max-width: 600px; line-height: 1.8; margin-bottom: 25px; }
    </style>
</head>
<body>

<div class="header">
    <span style="color:var(--accent); font-weight:bold;">FORTUNE MONITOR V1.1</span>
    <span id="stat">探索進度: 0%</span>
</div>

<div id="building-area">
    <div id="building"></div>
</div>

<div id="console">
    <div id="log">[系統就緒] 點擊視窗攔截私密訊號...</div>
    <button class="btn" onclick="resetSim()">重新啟動監控</button>
</div>

<div id="end-screen">
    <h2 style="color:var(--accent); letter-spacing: 4px;">監測任務終止</h2>
    <div class="end-text" id="final-desc"></div>
    <div class="end-text" style="font-size: 0.9em; border-top: 1px solid #333; padding-top: 15px;">
        「這是一個開放性的參觀活動... 如果你不願意目睹悲慘，可以看向大廈北側。那裡有陽光、林蔭與公園，是這城市最美好的一面。」
    </div>
    <button class="btn" style="width: auto; padding: 12px 30px;" onclick="closeEnd()">返回南側出口</button>
</div>

<script>
    const data = {
        "1A": "關佑開：『嘿嘿，這群住戶現在全走在我的尿裡。他們以為地毯是乾淨的？』",
        "3C": "賴進財：『積德啊...這獎券是仙佛給的回報。五萬塊一件陰功，我算得準。』",
        "4B": "梁隆潤：『入你娘！現在的年輕人道德淪喪。連路都不會走，只會吐痰。』",
        "6A": "蘇珊：『這些老頭簡直是垃圾。I hate them! 他們身上有發霉的味道。』",
        "7A": "魏丹誠：『你讓小孩叫管理員伯伯是什麼意思？他跟你什麼關係！』(碎裂聲)",
        "8B": "易婉君：『(水聲) 總覺得這公寓有個色狼...住樓上的，但我沒正眼瞧過他。』",
        "10C": "張德充：『舊金山、西雅圖...誰會選擇我？這隻死狗壓碎了就算了。』",
        "11D": "林秉宏：『累得像狗卻睡不著...我焦慮嗎？這世界上每個人都比我焦慮。』",
        "12B": "齊老太太：『兒啊...門後是誰...茶几倒了...紅豔豔的是血還是茶？分不清...』",
        "12D": "管滌凡：『太美了！這張畫一定拿獎...臭味肯定是老農夫的汗味，充滿靈魂。』",
        "12A": "范揚帆：『Fortune Building 唸起來多大氣，林南施懂什麼英文？』"
    };

    let seen = new Set();

    function init() {
        const b = document.getElementById('building');
        b.innerHTML = '';
        for (let f = 1; f <= 12; f++) {
            const div = document.createElement('div');
            div.className = 'floor';
            div.innerHTML = `<div class="label">${f}F</div>`;
            ['A', 'B', 'C', 'D'].forEach(r => {
                const id = f + r;
                const room = document.createElement('div');
                room.className = 'room';
                if (id === "12B") room.innerHTML = '<div class="scent"></div>';
                room.onclick = () => {
                    const log = document.getElementById('log');
                    const msg = data[id] || `[房間 ${id}] 無異常，錄得微弱電器運轉聲。`;
                    log.innerHTML = `<div class="entry"><span style="color:#555">[${id}]</span> ${msg}</div>` + log.innerHTML;
                    room.classList.add('seen');
                    if (data[id]) { seen.add(id); update(); }
                    if (seen.size >= 11 && id === "12B") trigger();
                };
                div.appendChild(room);
            });
            b.appendChild(div);
        }
    }

    function update() {
        document.getElementById('stat').innerText = `探索進度: ${Math.round((seen.size/11)*100)}%`;
    }

    function resetSim() {
        seen.clear();
        update();
        document.getElementById('log').innerHTML = '[記憶清空] 重新監控中...';
        init();
    }

    function trigger() {
        setTimeout(() => {
            document.getElementById('final-desc').innerText = "雙胞胎兄弟衝向頂樓，被腐敗的臭氣推撞。他們看見了茶漬、血跡、倒下的沙發，以及齊老太太猝死多日的屍體。這棟公寓的冷漠，最終在12樓化作實體的腐臭。";
            document.getElementById('end-screen').style.display = 'flex';
        }, 800);
    }

    function closeEnd() {
        document.getElementById('end-screen').style.display = 'none';
        resetSim();
    }

    init();
</script>
</body>
</html>
